name: Inspect overhead sprite art
on:
  push:
    branches: ['codex/overhead-world-2026-10-08']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test tests/overworld-assets.test.js
