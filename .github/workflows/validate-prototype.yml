name: Validate Seal Odyssey prototype

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /-seal-odyssey/
      VITE_BUILD_ID: validation-${{ github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: /tmp/seal-odyssey-browser-cache
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install locked application dependencies
        run: pnpm install --frozen-lockfile

      - name: Check browser-script syntax
        run: node --check scripts/browser-smoke.mjs

      - name: Run domain tests
        run: pnpm test

      - name: Build the production prototype
        run: pnpm build

      - name: Install pinned browser validation tools
        run: |
          mkdir -p "$RUNNER_TEMP/seal-smoke" "$GITHUB_WORKSPACE/artifacts-smoke"
          npm install --prefix "$RUNNER_TEMP/seal-smoke" --no-save --package-lock=false playwright@1.63.0
          cp scripts/browser-smoke.mjs "$RUNNER_TEMP/seal-smoke/browser-smoke.mjs"
          node "$RUNNER_TEMP/seal-smoke/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Validate production WebGL and interactions
        run: node "$RUNNER_TEMP/seal-smoke/browser-smoke.mjs"

      - name: Publish actual browser render previews
        if: ${{ always() && github.event_name == 'push' && hashFiles('artifacts-smoke/report.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-render-previews.mjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seal-odyssey-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts-smoke/
          if-no-files-found: warn
          retention-days: 14
